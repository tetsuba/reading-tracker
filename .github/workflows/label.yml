name: PR Labeler
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on target branch
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = context.payload.pull_request.base.ref;
              let label = '';

              if (targetBranch === 'dev') {
                label = 'feature';
              } else if (targetBranch === 'main') {
                label = 'hotfix';
              } else if (/^release\/[\w.-]+$/.test(targetBranch)) {
                label = 'bugfix';
              }

              // Ensure label exists before adding
              if (label) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo, // <-- FIXED HERE
                    issue_number: context.payload.pull_request.number,
                    labels: [label]
                  });
                } catch (error) {
                  if (error.status === 404) {
                    // Label does not exist, create it then add
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo, // <-- FIXED HERE
                      name: label,
                      color: 'ededed' // default color
                    });
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo, // <-- FIXED HERE
                      issue_number: context.payload.pull_request.number,
                      labels: [label]
                    });
                  } else {
                    throw error;
                  }
                }
              }