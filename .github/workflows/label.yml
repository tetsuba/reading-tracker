name: PR Labeler
on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on target branch and add "not ready to merge"
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const targetBranch = context.payload.pull_request.base.ref;
            let label = '';

            if (targetBranch === 'dev') {
              label = 'feature';
            } else if (targetBranch === 'main') {
              label = 'hotfix';
            } else if (/^release\/[\w.-]+$/.test(targetBranch)) {
              label = 'bugfix';
            }

            // List of labels to add
            const labelsToAdd = ['not ready to merge'];
            if (label) labelsToAdd.push(label);

            for (const lbl of labelsToAdd) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [lbl]
                });
              } catch (error) {
                if (error.status === 404) {
                  // Label does not exist, instruct the user to create it
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `Please create the label "${lbl}" in your repository to enable automatic labeling.`
                  });
                } else {
                  throw error;
                }
              }
            }